# Prepared for one-off use; dispatch only after release coordinator review.
# Intended repository: notzenco/lexis-apple-build (existing release secrets).
# Private input: exact commit in notzenco/lexis-apple containing only the reviewed
# transfer file at audit-transfer/Axio-Capture.app.tar.gz. A temporary transfer
# branch/commit must be prepared and approved separately; no public release needed.
name: One-off Capture notarization
on:
  workflow_dispatch:
    inputs:
      transfer_sha:
        description: Exact private transfer commit (40 lowercase hex characters)
        required: true
        type: string
      result_public_key:
        description: One-off RSA public PEM for encrypted result return (never a private key)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: axio-capture-one-off-notarization
  cancel-in-progress: false
jobs:
  notarize:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Validate exact transfer reference
        shell: bash
        env:
          TRANSFER_SHA: ${{ inputs.transfer_sha }}
        run: |
          set -euo pipefail
          [[ "$TRANSFER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Retrieve private signed artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: notzenco/lexis-apple
          ref: ${{ inputs.transfer_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
          sparse-checkout: audit-transfer
          path: transfer
      - name: Validate result encryption recipient before Apple submission
        shell: bash
        env:
          RESULT_PUBLIC_KEY: ${{ inputs.result_public_key }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RESULT_PUBLIC_KEY" > "$RUNNER_TEMP/capture-public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/capture-public.pem" -pubcheck -noout
          openssl rsa -pubin -in "$RUNNER_TEMP/capture-public.pem" -noout
          openssl rand 64 > "$RUNNER_TEMP/capture-probe.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/capture-public.pem" \
            -in "$RUNNER_TEMP/capture-probe.bin" -out "$RUNNER_TEMP/capture-probe.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm -f "$RUNNER_TEMP/capture-probe.bin" "$RUNNER_TEMP/capture-probe.enc"
      - name: Verify archive and Developer ID signature
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/capture-results" "$RUNNER_TEMP/capture-app"
          exec >"$RUNNER_TEMP/capture-results/preflight.log" 2>&1
          archive="$GITHUB_WORKSPACE/transfer/audit-transfer/Axio-Capture.app.tar.gz"
          expected=841da47ba15fca08fbb5896b0f17d6e2ab30703963084feabc6184647b6d7e3f
          actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          [[ "$actual" == "$expected" ]]
          printf '%s\n' "$actual" > "$RUNNER_TEMP/capture-results/input-sha256.txt"
          tar -xzf "$archive" -C "$RUNNER_TEMP/capture-app"
          app="$RUNNER_TEMP/capture-app/Axio Capture.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2> "$RUNNER_TEMP/capture-results/signature.txt"
          grep -qx 'TeamIdentifier=N7447R8KW2' "$RUNNER_TEMP/capture-results/signature.txt"
          grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/capture-results/signature.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/capture-results/signature.txt"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" == me.umbra.axio-capture ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" == 0.1.1 ]]
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/capture-submit.zip"
      - name: Submit to Apple and preserve decision
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APP_STORE_CONNECT_API_KEY"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          auth_key="$RUNNER_TEMP/capture-auth.p8"
          trap 'rm -f "$auth_key"' EXIT
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$auth_key"
          auth=(--key "$auth_key" --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID")
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/capture-submit.zip" "${auth[@]}" \
            --wait --timeout 15m --output-format json \
            > "$RUNNER_TEMP/capture-results/notary-submit.json" \
            2> "$RUNNER_TEMP/capture-results/notary-stderr.log"
          submit_exit=$?
          set -e
          printf '%s\n' "$submit_exit" > "$RUNNER_TEMP/capture-results/notary-exit.txt"
          submission_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/capture-results/notary-submit.json" 2>/dev/null || true)
          if [[ -n "$submission_id" ]]; then
            xcrun notarytool log "$submission_id" "${auth[@]}" \
              "$RUNNER_TEMP/capture-results/notary-log.json" \
              > "$RUNNER_TEMP/capture-results/notary-log-request.log" 2>&1 || true
          fi
          # Timed-out submissions continue at Apple. Preserve their ID; do not retry automatically.
          [[ "$submit_exit" == 0 ]]
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "Accepted"' "$RUNNER_TEMP/capture-results/notary-submit.json"
      - name: Staple and assess the accepted application
        shell: bash
        run: |
          set -euo pipefail
          exec >"$RUNNER_TEMP/capture-results/acceptance.log" 2>&1
          app="$RUNNER_TEMP/capture-app/Axio Capture.app"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          tar -czf "$RUNNER_TEMP/capture-results/Axio-Capture-stapled.app.tar.gz" \
            -C "$RUNNER_TEMP/capture-app" 'Axio Capture.app'
          shasum -a 256 "$RUNNER_TEMP/capture-results/Axio-Capture-stapled.app.tar.gz" \
            > "$RUNNER_TEMP/capture-results/stapled-sha256.txt"
      - name: Encrypt result and private diagnostics
        id: encrypt_result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.result_public_key }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DIAGNOSTIC_PUBLIC_KEY"
          mkdir -p "$RUNNER_TEMP/capture-results" "$RUNNER_TEMP/capture-encrypted"
          tar -czf "$RUNNER_TEMP/capture-results.tar.gz" -C "$RUNNER_TEMP" capture-results
          printf '%s' "$DIAGNOSTIC_PUBLIC_KEY" > "$RUNNER_TEMP/capture-public.pem"
          python3 - <<'PYKEY'
          import json, os, secrets
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          keys = {'encryption': secrets.token_hex(32), 'authentication': secrets.token_hex(32)}
          (root / 'capture-keys.json').write_text(json.dumps(keys))
          (root / 'capture-key.hex').write_text(keys['encryption'])
          PYKEY
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/capture-results.tar.gz" \
            -out "$RUNNER_TEMP/capture-encrypted/results.tar.gz.enc" \
            -pass file:"$RUNNER_TEMP/capture-key.hex"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/capture-public.pem" \
            -in "$RUNNER_TEMP/capture-keys.json" \
            -out "$RUNNER_TEMP/capture-encrypted/key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PYMAC'
          import hashlib, hmac, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          keys = json.loads((root / 'capture-keys.json').read_text())
          data = (root / 'capture-encrypted/results.tar.gz.enc').read_bytes()
          tag = hmac.new(bytes.fromhex(keys['authentication']), data, hashlib.sha256).hexdigest()
          (root / 'capture-encrypted/results.hmac-sha256').write_text(tag + '\n')
          PYMAC
      - name: Preserve encrypted result for owner retrieval
        id: encrypted_result
        if: always() && steps.encrypt_result.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capture-notarization-encrypted-result
          path: ${{ runner.temp }}/capture-encrypted/
          if-no-files-found: error
          retention-days: 1
      - name: Remove plaintext only after encrypted artifact upload succeeds
        if: always() && steps.encrypted_result.outcome == 'success'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/capture-auth.p8" "$RUNNER_TEMP/capture-public.pem" \
            "$RUNNER_TEMP/capture-key.hex" "$RUNNER_TEMP/capture-keys.json" "$RUNNER_TEMP/capture-submit.zip" \
            "$RUNNER_TEMP/capture-results.tar.gz"
          rm -rf "$RUNNER_TEMP/capture-results" "$RUNNER_TEMP/capture-app" "$GITHUB_WORKSPACE/transfer"
